<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Contact Form</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 16px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
      margin-bottom: 24px;
    }

    .row {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      width: fit-content;
    }

    .seal-area {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 60px;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Contact Me</h1>
      <p>This is a static test contact form page.</p>

      <form action="#" method="post">
        <div class="row">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
          </div>
        </div>

        <div>
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="How can I help?" />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>

      <div class="seal-area">
        <div id='ss_gmo_globalsign_secured_site_seal' oncontextmenu='return false;' style='width:100px; height:50px'><img id='ss_gmo_globalsign_img' src='data:image/gif;base64,R0lGODlhAQABAGAAACH5BAEKAP8ALAAAAAABAAEAAAgEAP8FBAA7 ' alt='' onclick='ss_open_profile()' style='cursor:pointer; border:0; width:100%' ></div><script>window.addEventListener('load', () => {let s = document.createElement('script');s.src = 'https://seal.atlas.globalsign.com/gss/one/seal?image=seal_100-50_en.png';document.body.appendChild(s);})</script>
      </div>
    </section>
  </main>
</body>
</html>
